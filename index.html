<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Interactive Student Profile</h1>
            <section class="control-panel">
                <h2>Student Controls</h2>
                <div class="form-group">
                    <label for="nameInput">Student Name</label>
                    <input 
                        type="text"
                        id="nameInput"
                        placeholder="Enter Student Name"
                    >
                </div>
                <div class="form-group">
                    <label for="programInput">Program</label>
                    <select id="programInput">
                        <option value="BS Information Technology">
                            BS Information Technology
                        </option>
                        <option value="BS Computer Science">
                            BS Computer Science
                        </option>
                        <option value="BS Accountancy">
                            BS Accountancy
                        </option>
                    </select>
                </div>
                <div class="yearInput">
                    <label for="yearInput">Year Level</label>
                    <select id="yearInput">
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year" selected>3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="statusInput">Status</label>
                    <select id="statusInput">
                        <option value="active" selected>Active</option>
                        <option value="inactive" >Inactive</option>
                    </select>
                </div>
                <div class="buttons">
                    <button id="updateBtn" type="button">Update Profile</button>
                    <button id="toggleDetailsBtn" type="button">Toggle Details</button>
                    <button id="themeBtn" type="button">Toggle Theme</button>
                    <button id="resetBtn" type="button">Reset</button>
                </div>
                <p id="formMessage"></p>
            </section>

            <section class="profile-section">
                <article id="profileCard" class="profile-card active" data-student-id="2026-001" data-
                    status="active">
                        <h2 id="profileName">Maria Santos</h2>
                        <p id="profileProgram">BS Information Technology</p>
                        <p id="profileYear">3rd Year</p>
                        <p id="profileStatus">Active</p>
                        <div id="detailsPanel" class="details-panel">
                            <p id="studentIdDisplay">Student ID: 2026-001</p>
                        </div>
                </article>
            </section>   
        </main>
    </body>
</html>
